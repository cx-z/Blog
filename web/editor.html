<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布文章 - 简易博客系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">📝 简易博客</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="editor.html">发布文章</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-5">
        <div class="row">
            <div class="col-lg-8">
                <h1 class="mb-4">发布新文章</h1>
                
                <form id="post-form" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="post-title" class="form-label">文章标题</label>
                        <input type="text" class="form-control" id="post-title" placeholder="输入文章标题" required>
                        <div class="invalid-feedback">
                            请输入文章标题
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="post-content" class="form-label">文章内容</label>
                        <textarea class="form-control" id="post-content" rows="12" placeholder="输入文章内容" required></textarea>
                        <div class="invalid-feedback">
                            请输入文章内容
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">发布文章</button>
                        <a href="index.html" class="btn btn-secondary btn-lg">取消</a>
                    </div>
                </form>

                <div id="success-message" class="alert alert-success mt-3" style="display: none;">
                    <strong>成功！</strong> 文章已发布。<a href="index.html">返回首页查看</a>
                </div>

                <div id="error-message" class="alert alert-danger mt-3" style="display: none;">
                    <strong>错误！</strong> <span id="error-text"></span>
                </div>
            </div>

            <aside class="col-lg-4">
                <div class="card bg-light">
                    <div class="card-body">
                        <h5 class="card-title">📝 撰写提示</h5>
                        <ul class="list-unstyled">
                            <li>✓ 标题要简明扼要</li>
                            <li>✓ 内容要清晰易读</li>
                            <li>✓ 支持纯文本内容</li>
                            <li>✓ 发布后可返回首页查看</li>
                        </ul>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p>&copy; 2026 简易博客系统 | 由 C++ Crow 驱动</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
